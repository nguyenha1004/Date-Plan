<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Date Quest</title>
<meta name="theme-color" content="#bfe3ff">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap&subset=vietnamese">
<style>
/* Layout: a handheld "game screen" on a pixel sky. Slide 1 invites, slide 2 is a big pixel-art map of Saigon with tappable stops, slide 3 closes. */
:root {
  --sky: #bfe3ff;
  --paper: #fff6ea;
  --ink: #2d1e3a;
  --rose: #ff5d8f;
  --rose-dk: #c93a6a;
  --butter: #ffd84d;
  --mint: #7ee0b5;
  --muted: #6d5a7a;
  --font: "VT323", "Courier New", ui-monospace, monospace;
  --px: 4px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--sky); overflow-x: hidden; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font);
  font-size: 22px;
  line-height: 1.15;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  overflow-x: hidden;
}
body::after {
  content: ""; position: fixed; inset: auto 0 0 0; height: 48px; z-index: 0;
  background:
    repeating-linear-gradient(90deg, var(--mint) 0 16px, #6bd0a4 16px 32px) top / 100% 12px no-repeat,
    #b98a5e;
  border-top: var(--px) solid var(--ink);
}
.clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.cloud {
  position: absolute; width: 8px; height: 8px;
  box-shadow:
    16px 0 #fff, 24px 0 #fff, 32px 0 #fff,
    8px 8px #fff, 16px 8px #fff, 24px 8px #fff, 32px 8px #fff, 40px 8px #fff, 48px 8px #fff,
    0 16px #fff, 8px 16px #fff, 16px 16px #fff, 24px 16px #fff, 32px 16px #fff, 40px 16px #fff, 48px 16px #fff, 56px 16px #fff;
  animation: drift 70s linear infinite; opacity: .9;
}
.cloud:nth-child(1) { top: 8%; left: -80px; }
.cloud:nth-child(2) { top: 30%; left: -80px; animation-duration: 95s; animation-delay: -40s; }
.cloud:nth-child(3) { top: 62%; left: -80px; animation-duration: 80s; animation-delay: -20s; }
@keyframes drift { to { left: calc(100% + 80px); } }

.game { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 60px; }
.narrow { width: 100%; max-width: 620px; margin-inline: auto; }

.pix {
  background: var(--paper);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ink), 0 var(--px) 0 0 var(--ink),
    calc(-1 * var(--px)) 0 0 0 var(--ink), var(--px) 0 0 0 var(--ink),
    0 calc(var(--px) * 2) 0 0 rgba(45,30,58,.25);
  margin: var(--px);
}

.hud {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--ink); color: var(--paper);
  box-shadow: 0 calc(var(--px) * 2) 0 0 rgba(45,30,58,.25);
}
.hud .lv { color: var(--butter); letter-spacing: 1px; }
.hud canvas { width: 20px; height: 20px; image-rendering: pixelated; vertical-align: middle; }

.title { text-align: center; }
.title h1 {
  margin: 0; font-size: clamp(44px, 11vw, 72px); font-weight: 400; line-height: .9; letter-spacing: 2px;
  color: var(--rose); text-wrap: balance;
  text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
}
.title p { margin: 6px 0 0; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }

.dialog { padding: 18px 18px 16px; position: relative; }
.who {
  position: absolute; top: -18px; left: 12px; background: var(--rose); color: var(--paper);
  padding: 2px 10px; font-size: 20px; letter-spacing: 1px; box-shadow: 0 0 0 3px var(--ink);
}
.dialog p { margin: 6px 0 0; font-size: 25px; text-wrap: pretty; }
.blink { animation: blink 1s steps(2) infinite; color: var(--rose); }
@keyframes blink { 50% { opacity: 0; } }

.row { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; }
.btn {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 26px; letter-spacing: 1px;
  padding: 8px 22px; color: var(--paper); background: var(--rose); margin: 4px;
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), inset 0 -4px 0 0 var(--rose-dk);
}
.btn:active { transform: translateY(2px); }
.btn.ghost { background: var(--paper); color: var(--ink); box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), inset 0 -4px 0 0 #e8dccb; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .stop:focus-visible, .map-link:focus-visible { outline: 3px dashed var(--rose); outline-offset: 5px; }
.no-zone { position: relative; min-height: 70px; }
#btnNo { transition: transform .15s steps(3); }
.toast { text-align: center; font-size: 22px; min-height: 26px; margin: 0; }

/* slides */
.slide { display: flex; flex-direction: column; gap: 18px; }
.slide.enter-next { animation: inNext .28s steps(4); }
.slide.enter-prev { animation: inPrev .28s steps(4); }
@keyframes inNext { from { transform: translateX(28px); opacity: .2; } }
@keyframes inPrev { from { transform: translateX(-28px); opacity: .2; } }

/* ticket strip */
.ticket { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 24px; background: var(--butter); }
.ticket div { display: flex; flex-direction: column; min-width: 0; }
.ticket dt { font-size: 17px; letter-spacing: 1px; text-transform: uppercase; opacity: .7; }
.ticket dd { margin: 0; font-size: 24px; overflow-wrap: anywhere; }

/* map: tự vẽ bằng canvas, không cần tải bản đồ ngoài */
.mapframe { padding: 0; position: relative; }
#map { position: relative; width: 100%; line-height: 0; overflow: hidden; }
#world { display: block; width: 100%; height: auto; image-rendering: pixelated; }
#pins { position: absolute; inset: 0; }
.map-tag {
  position: absolute; z-index: 5; top: 10px; left: 10px; pointer-events: none; line-height: 1.15;
  background: var(--ink); color: var(--butter); padding: 2px 10px; font-size: 20px; letter-spacing: 1px;
}
.pin {
  position: absolute; width: 52px; height: 60px; transform: translate(-50%, -100%);
  appearance: none; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; font: inherit; line-height: 1.15; color: var(--ink);
}
.pin .inner { position: absolute; inset: 0; transform-origin: 50% 100%; }
.pin .box {
  position: absolute; left: 4px; top: 6px; width: 44px; height: 44px; display: grid; place-items: center;
  background: var(--paper);
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
}
.pin .box canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.pin .tip { position: absolute; left: 20px; top: 52px; width: 12px; height: 8px; background: var(--ink); }
.pin .num {
  position: absolute; right: -4px; top: -4px; min-width: 22px; height: 22px; padding: 0 4px;
  background: var(--rose); color: var(--paper); font-size: 20px; line-height: 22px; text-align: center;
  box-shadow: 0 0 0 3px var(--ink);
}
.pin.on .box { background: var(--butter); }
.pin.on .inner { animation: hop .6s steps(3) infinite alternate; }
.pin.secret { cursor: help; }
.pin.secret .box { background: #e8dccb; font-size: 34px; color: var(--muted); }
.pin.secret .num { background: var(--muted); }
.pin:focus-visible { outline: 3px dashed var(--rose); outline-offset: 2px; }
@keyframes hop { to { transform: translateY(-6px); } }
.player {
  position: absolute; width: 34px; height: 34px; transform: translate(-50%, 4px); pointer-events: none;
  transition: left .8s steps(8), top .8s steps(8);
}
.player canvas { width: 34px; height: 34px; image-rendering: pixelated; }
@media (max-width: 520px) {
  .pin .inner { transform: scale(.72); }
  .pin.on .inner { animation-name: hopSm; }
  .player, .player canvas { width: 26px; height: 26px; }
}
@keyframes hopSm { from { transform: scale(.72); } to { transform: scale(.72) translateY(-6px); } }

/* stop list */
.stops { display: flex; gap: 12px; flex-wrap: wrap; }
.stop {
  appearance: none; border: 0; cursor: pointer; font: inherit; color: inherit; font-size: 22px;
  padding: 6px 12px; display: inline-flex; align-items: center; gap: 8px;
}
.stop b { font-weight: 400; background: var(--rose); color: var(--paper); padding: 0 6px; }
.stop[aria-pressed="true"] { background: var(--butter); }
.stop.secret { cursor: default; color: var(--muted); background: transparent; box-shadow: none; outline: 3px dashed var(--muted); outline-offset: -3px; margin: 4px; }

/* detail card */
.detail { padding: 14px 16px; display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: start; }
.detail .icon { width: 84px; height: 84px; image-rendering: pixelated; }
.detail .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.detail .top { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.detail .stg { color: var(--rose-dk); letter-spacing: 1px; font-size: 19px; }
.detail .time { font-size: 24px; font-variant-numeric: tabular-nums; background: var(--ink); color: var(--paper); padding: 0 8px; }
.detail h2 { margin: 0; font-size: 32px; font-weight: 400; line-height: 1; text-wrap: balance; }
.detail p { margin: 0; font-size: 22px; text-wrap: pretty; }
.map-link { color: var(--rose-dk); font-size: 21px; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }

/* ending */
.big { padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.big canvas { width: 120px; height: 120px; image-rendering: pixelated; }
.end { font-size: 34px; color: var(--rose-dk); margin: 0; }
.notes { padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.notes h3 { margin: 0; font-size: 26px; font-weight: 400; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.notes li::before { content: "▸ "; color: var(--rose); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.nav .btn { font-size: 22px; padding: 6px 14px; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dot { width: 12px; height: 12px; background: var(--paper); box-shadow: 0 0 0 3px var(--ink); }
.dot.on { background: var(--rose); }

@media (max-width: 480px) {
  .detail { grid-template-columns: 60px 1fr; }
  .detail .icon { width: 60px; height: 60px; }
}
@media (prefers-reduced-motion: reduce) {
  .cloud, .blink, .pin.on { animation: none; }
  #btnNo { transition: none; }
  .slide.enter-next, .slide.enter-prev { animation: none; }
}
</style>
</head>
<body>

<div class="clouds" aria-hidden="true"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>

<main class="game">
  <div class="hud narrow">
    <span class="lv">LV.1 · FIRST DATE</span>
    <span id="hudHeart"></span>
  </div>

  <header class="title">
    <h1>FIRST DATE QUEST</h1>
    <p>Player 2 đã được mời</p>
  </header>

  <!-- Slide 1: lời mời -->
  <section class="slide narrow" id="s-intro">
    <div class="dialog pix">
      <span class="who" id="whoIntro">ANH</span>
      <div id="introText"></div>
    </div>
    <div class="row no-zone" id="noZone">
      <button class="btn" id="btnYes" type="button">CÓ ♥</button>
      <button class="btn ghost" id="btnNo" type="button">KHÔNG</button>
    </div>
    <p class="toast" id="noMsg" aria-live="polite"></p>
  </section>

  <!-- Slide 2: bản đồ -->
  <section class="slide" id="s-map" hidden>
    <div class="dialog pix narrow">
      <span class="who" id="whoMap">ANH</span>
      <p>Đây là bản đồ buổi hẹn của mình. Em bấm vào từng điểm để xem nhé.</p>
    </div>
    <dl class="ticket pix" id="ticket"></dl>
    <div class="mapframe pix">
      <span class="map-tag">WORLD 1 · SÀI GÒN</span>
      <div id="map"><canvas id="world" role="img" aria-label="Bản đồ pixel các điểm hẹn"></canvas><div id="pins"></div></div>
    </div>
    <div class="stops" id="stops"></div>
    <div class="detail pix" id="detail" aria-live="polite"></div>
  </section>

  <!-- Slide 3: kết -->
  <section class="slide narrow" id="s-end" hidden>
    <div class="big pix">
      <span id="endHeart"></span>
      <p class="end" id="endLine"></p>
    </div>
    <div class="notes pix" id="notesBox">
      <h3>Ghi chú cho Player 2</h3>
      <ul id="notes"></ul>
    </div>
  </section>

  <nav class="nav narrow" id="nav" hidden>
    <button class="btn ghost" id="btnPrev" type="button">◀ LẠI</button>
    <div class="dots" id="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span></div>
    <button class="btn" id="btnNext" type="button">TIẾP ▶</button>
  </nav>
</main>

<script>
/* =========================================================
   SỬA LỘ TRÌNH Ở ĐÂY
   - Bản đồ là bản đồ game tự vẽ. Các điểm tự xếp dọc con đường theo thứ tự
     trong stages (tối đa 6 điểm, tính cả điểm bí mật).
   - sprite: coffee, popcorn, tree, museum, vase, gamepad, city, lantern,
             pho, hotpot, grill, sushi, pizza, snack, boba, icecream, cake, che,
             scooter, home, heart
   - time: để "" nếu chưa chốt giờ.
   - secretStops: số điểm "???" hiện trong danh sách, cho vui khi chưa công bố.
   ========================================================= */
const PLAN = {
  from: "ANH",
  intro: [
    "Chào em! Anh muốn rủ em đi một buổi hẹn đầu tiên.",
    "Anh đã lên sẵn lộ trình trên bản đồ rồi, em chỉ cần mang theo nụ cười thôi.",
    "Em có đồng ý đi với anh không?"
  ],
  date: "Anh báo em sau",
  pickup: "Nhà em",
  dressCode: "Thoải mái, đi giày êm",
  stages: [
    {
      time: "",
      sprite: "home",
      place: "Nhà em",
      desc: "Anh qua tận nhà đón em. Tới nơi anh nhắn em."
    }
    // Thêm điểm tiếp theo, ví dụ:
    // { time: "18:00", sprite: "coffee", place: "Tên quán", desc: "Làm gì ở đó" },
  ],
  secretStops: 2,
  notes: [
    "Các điểm tiếp theo sẽ hiện dần trên bản đồ.",
    "Em không ăn được món gì thì nhắn anh trước nha."
  ],
  ending: "Hẹn gặp em nhé ♥"
};

(() => {
  const COLORS = {
    k: "#2d1e3a", r: "#ff5d8f", p: "#ffb3c9", y: "#ffd84d", w: "#ffffff",
    b: "#9a6a43", g: "#5cc98f", d: "#2f9a64", c: "#f2a65a", o: "#f27a3c",
    l: "#b9a6ff", s: "#b8b0c4"
  };
  const SPRITES = {
    heart: ["..kk..kk..",".krrkkrrk.","krwrrrrrrk","krrrrrrrrk","krrrrrrrrk",".krrrrrrk.","..krrrrk..","...krrk...","....kk...."],
    coffee: ["..s..s....","...s..s...","..s..s....","kkkkkkkk..","kbbbbbbkkk","kwwwwwwk.k","kwwrrwwk.k","kwwwwwwkkk",".kwwwwk...","..kkkk...."],
    popcorn: ["..w.y.w...",".wywywyw..","wywywywyw.","kkkkkkkkk.","krwrwrwrk.","krwrwrwrk.",".krwrwrk..",".krwrwrk..",".kkkkkkk.."],
    tree: ["...gggg...","..gggggg..",".gggdgggg.",".ggggggdg.",".gdgggggg.","..gggggg..","....bb....","....bb....","...bbbb...","dddddddddd"],
    museum: ["....kk....","...kyyk...","..kyyyyk..",".kkkkkkkk.","..s.ss.s..","..s.ss.s..","..s.ss.s..","..s.ss.s..",".kkkkkkkk.","kkkkkkkkkk"],
    vase: ["...kkkk...","...kook...","..kooook..",".kooyyook.",".koyooyok.",".kooyyook.",".kooooook.","..kooook..","...kkkk..."],
    gamepad: ["..........",".kkkkkkkk.","kllllllllk","kllklllrlk","klkkklrlyk","kllklllylk","kllkkkkllk",".kk....kk."],
    city: [".......yy.","......y...","......y...",".......yy.","..........",".kk...kkk.",".kyk..kyk.",".kkkk.kkkk",".kykk.kyyk","kkkkkkkkkk"],
    lantern: ["....kk....","...kkkk...","..krrrrk..",".krryrrrk.",".krrrrrrk.",".krryrrrk.","..krrrrk..","...kkkk...","....yy....","....y....."],
    pho: ["..s.s.s...","...s.s.s..","..s.s.s...","kkkkkkkkkk","kwwgwwwgwk","kyywyyywyk",".kcccccck.","..kcccck..","...kkkk..."],
    hotpot: [".s..s..s..","..s..s..s.","kkkkkkkkkk","kroogroork","krrrrrrrrk","kkkkkkkkkk",".k......k.",".kkkkkkkk.","..o.o.o...","...o.o...."],
    grill: ["..b.r.b...",".r.b.r.b..","kkkkkkkkkk","k.k.k.k.kk","kkkkkkkkkk",".ksssssk..","..o.o.o...","..k...k...","..k...k..."],
    sushi: ["..........","..kkkkkk..",".kooooook.",".kowowowk.",".kwwwwwwk.",".kwwwwwwk.",".kkkkkkkk.","..kkkkkk.."],
    pizza: ["kkkkkkkkkk","kbbbbbbbbk",".kyyryyyk.",".kyyyyryk.","..kyryyk..","..kyyyyk..","...kyyk...","...kyrk...","....kk...."],
    snack: ["....k.....","...kook...","...kook...","....k.....","...kook...","...kook...","....k.....","...kook...","...kook...","....k....."],
    boba: ["....kk....","....kk....",".kkkkkkkk.",".kppppppk.",".kppppppk.","..kppppk..","..kbpbpk..","..kpbpbk..","...kkkk..."],
    icecream: ["...kkkk...","..kppppk..",".kppwpppk.",".kppppppk.",".kkkkkkkk.","..kyyyyk..","..kybyyk..","...kyyk...","...kyyk...","....kk...."],
    cake: ["....r.....","....k.....",".kkkkkkkk.","kwwwwwwwwk","kppppppppk","kwwwwwwwwk","kbbbbbbbbk","kkkkkkkkkk"],
    che: [".kkkkkkkk.",".kwwwwwwk.",".kggggggk.",".kyyyyyyk.","..kllllk..","..kbbbbk..","...kkkk...","....kk....","...kkkk..."],
    scooter: ["..........","......kk..",".......k..","..kkkkkk..",".krrrrrkk.","krrrrrrrrk","kkkkkkkkkk",".kk....kk.","kwwk..kwwk",".kk....kk."],
    home: ["....kk....","...krrk...","..krrrrk..",".krrrrrrk.","krrrrrrrrk",".kwwwwwwk.",".kwykkwyk.",".kwwwkbwk.",".kwwwkbwk.",".kkkkkkkk."]
  };

  function drawSprite(name, scale) {
    const rows = SPRITES[name] || SPRITES.heart;
    const c = document.createElement("canvas");
    c.width = 10 * scale; c.height = 10 * scale;
    const ctx = c.getContext("2d");
    const yOff = Math.floor((10 - rows.length) / 2);
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (!COLORS[ch]) return;
      ctx.fillStyle = COLORS[ch];
      ctx.fillRect(x * scale, (y + yOff) * scale, scale, scale);
    }));
    c.setAttribute("aria-hidden", "true");
    return c;
  }

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // ---------- Slide 1 ----------
  $("hudHeart").appendChild(drawSprite("heart", 2));
  $("whoIntro").textContent = $("whoMap").textContent = PLAN.from.toUpperCase();
  PLAN.intro.forEach((line, i) => {
    const p = el("p", null, line);
    if (i === PLAN.intro.length - 1) { p.append(" "); p.appendChild(el("span", "blink", "▼")); }
    $("introText").appendChild(p);
  });

  // ---------- Slide 2: ticket + map ----------
  [["Ngày", PLAN.date], ["Điểm đón", PLAN.pickup], ["Trang phục", PLAN.dressCode]].forEach(([k, v]) => {
    if (!v) return;
    const row = el("div"); row.append(el("dt", null, k), el("dd", null, v)); $("ticket").appendChild(row);
  });

  const stages = PLAN.stages;
  const stageLabel = (i) => (i === 0 ? "START" : i === stages.length - 1 ? "STAGE CUỐI" : "STAGE " + (i + 1));
  let selected = 0;

  // Bản đồ game: lưới W x H ô, mỗi ô CELL px, phóng to bằng CSS không làm mượt.
  const W = 80, H = 52, CELL = 8;
  const SLOTS = [[10, 40], [24, 26], [38, 38], [54, 22], [66, 36], [72, 12]];
  const total = Math.min(SLOTS.length, stages.length + (PLAN.secretStops || 0));
  const route = SLOTS.slice(0, Math.max(total, 2));

  function drawWorld() {
    const cv = $("world");
    cv.width = W * CELL; cv.height = H * CELL;
    const ctx = cv.getContext("2d");
    const C = {
      grass: "#8fdc9f", grass2: "#86d597", water: "#7cc4f2", ripple: "#b5e2fb", sand: "#f3dfae",
      road: "#f6e7c8", edge: "#c9a27a", dash: "#ffffff", plank: "#9a6a43", rail: "#6b4a2e",
      tree: "#2f9a64", leaf: "#5cc98f", trunk: "#9a6a43", ink: "#2d1e3a",
      wall: "#fff6ea", wall2: "#b9a6ff", wall3: "#ffb3c9", win: "#ffd84d", roof: "#ff5d8f", f1: "#ff5d8f", f2: "#ffd84d"
    };
    const grid = Array.from({ length: H }, () => Array(W).fill("grass"));
    const px = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) { ctx.fillStyle = c; ctx.fillRect(x * CELL, y * CELL, CELL, CELL); } };
    let seed = 20261025;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // cỏ
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) px(x, y, ((x >> 2) + (y >> 2)) % 2 ? C.grass : C.grass2);

    // sông uốn lượn từ trên xuống
    for (let y = 0; y < H; y++) {
      const cx = Math.round(45 + 5 * Math.sin(y / 6));
      for (let x = cx - 3; x <= cx + 3; x++) {
        const bank = x === cx - 3 || x === cx + 3;
        grid[y][x] = bank ? "sand" : "water";
        px(x, y, bank ? C.sand : C.water);
        if (!bank && rnd() < 0.12) px(x, y, C.ripple);
      }
    }

    // đường đi hình chữ L nối các điểm
    const roadCells = [];
    const mark = (x, y) => roadCells.push([x, y]);
    for (let i = 0; i < route.length - 1; i++) {
      const [x1, y1] = route[i], [x2, y2] = route[i + 1];
      const sx = Math.sign(x2 - x1), sy = Math.sign(y2 - y1);
      for (let x = x1; x !== x2; x += sx) mark(x, y1);
      for (let y = y1; y !== y2 + sy; y += sy || 1) { mark(x2, y); if (!sy) break; }
    }
    const isRoad = new Set();
    roadCells.forEach(([x, y]) => { for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) isRoad.add((x + dx) + "," + (y + dy)); });
    // viền đường
    isRoad.forEach((k) => {
      const [x, y] = k.split(",").map(Number);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const nk = (x + dx) + "," + (y + dy);
        if (!isRoad.has(nk) && grid[y + dy] && grid[y + dy][x + dx] && grid[y + dy][x + dx] !== "edge") {
          const water = grid[y + dy][x + dx] === "water" || grid[y + dy][x + dx] === "sand";
          px(x + dx, y + dy, water ? C.rail : C.edge);
          grid[y + dy][x + dx] = water ? grid[y + dy][x + dx] : "edge";
        }
      }
    });
    // mặt đường, đoạn qua sông là cầu gỗ
    isRoad.forEach((k) => {
      const [x, y] = k.split(",").map(Number);
      if (!grid[y] || grid[y][x] === undefined) return;
      const overWater = grid[y][x] === "water" || grid[y][x] === "sand";
      px(x, y, overWater ? ((x + y) % 2 ? C.plank : "#b07f52") : C.road);
      grid[y][x] = "road";
    });
    roadCells.forEach(([x, y], i) => { if (i % 4 < 2 && grid[y][x] === "road") px(x, y, C.dash); });

    const free = (x, y, w, h, pad) => {
      for (let yy = y - pad; yy < y + h + pad; yy++) for (let xx = x - pad; xx < x + w + pad; xx++) {
        if (yy < 0 || xx < 0 || yy >= H || xx >= W) return false;
        if (grid[yy][xx] !== "grass") return false;
      }
      return !route.some(([sx, sy]) => Math.abs(sx - x) < 6 && Math.abs(sy - y) < 8);
    };
    const claim = (x, y, w, h) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) grid[yy][xx] = "deco"; };

    // khu phố bên kia sông
    for (let t = 0; t < 120; t++) {
      const w = 3 + Math.floor(rnd() * 2), h = 4 + Math.floor(rnd() * 6);
      const x = 54 + Math.floor(rnd() * 24), y = 2 + Math.floor(rnd() * 14);
      if (!free(x, y, w, h, 1)) continue;
      claim(x, y, w, h);
      const wall = [C.wall, C.wall2, C.wall3][Math.floor(rnd() * 3)];
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) {
        const edge = xx === x || xx === x + w - 1 || yy === y || yy === y + h - 1;
        px(xx, yy, edge ? C.ink : ((yy - y) % 2 === 0 && rnd() < 0.7 ? C.win : wall));
      }
    }
    // nhà nhỏ khu dân cư
    for (let t = 0; t < 80; t++) {
      const x = 2 + Math.floor(rnd() * 34), y = 24 + Math.floor(rnd() * 26);
      if (!free(x, y, 4, 4, 1)) continue;
      claim(x, y, 4, 4);
      px(x + 1, y, C.ink); px(x + 2, y, C.ink);
      for (let xx = x; xx < x + 4; xx++) px(xx, y + 1, C.roof);
      px(x, y + 2, C.ink); px(x + 1, y + 2, C.wall); px(x + 2, y + 2, C.win); px(x + 3, y + 2, C.ink);
      px(x, y + 3, C.ink); px(x + 1, y + 3, C.trunk); px(x + 2, y + 3, C.wall); px(x + 3, y + 3, C.ink);
    }
    // cây
    for (let t = 0; t < 400; t++) {
      const x = Math.floor(rnd() * (W - 2)), y = Math.floor(rnd() * (H - 3));
      if (!free(x, y, 2, 3, 0)) continue;
      claim(x, y, 2, 3);
      px(x, y, C.leaf); px(x + 1, y, C.tree); px(x, y + 1, C.tree); px(x + 1, y + 1, C.tree); px(x, y + 2, C.trunk);
    }
    // hoa
    for (let t = 0; t < 160; t++) {
      const x = Math.floor(rnd() * W), y = Math.floor(rnd() * H);
      if (grid[y][x] === "grass") px(x, y, rnd() < 0.5 ? C.f1 : C.f2);
    }
  }

  const player = el("div", "player");
  player.appendChild(drawSprite("scooter", 4));
  const pos = (i) => ({ left: ((route[i][0] + 0.5) / W * 100) + "%", top: ((route[i][1] + 0.5) / H * 100) + "%" });

  function renderPins() {
    const box = $("pins");
    box.querySelectorAll(".pin").forEach((n) => n.remove());
    for (let i = 0; i < total; i++) {
      const real = i < stages.length;
      const pin = el(real ? "button" : "span", "pin" + (real ? "" : " secret") + (i === selected ? " on" : ""));
      Object.assign(pin.style, pos(i));
      const inner = el("span", "inner");
      const b = el("span", "box");
      if (real) b.appendChild(drawSprite(stages[i].sprite, 4)); else b.textContent = "?";
      inner.append(b, el("span", "tip"), el("span", "num", String(i + 1)));
      pin.appendChild(inner);
      if (real) {
        pin.type = "button";
        pin.setAttribute("aria-label", (i + 1) + ". " + stages[i].place);
        pin.addEventListener("click", () => select(i));
      } else pin.title = "Bí mật, sắp mở";
      box.appendChild(pin);
    }
    Object.assign(player.style, pos(Math.min(selected, total - 1)));
    if (!player.isConnected) box.appendChild(player);
  }

  function renderStops() {
    const box = $("stops");
    box.textContent = "";
    stages.forEach((st, i) => {
      const b = el("button", "stop pix");
      b.type = "button"; b.id = "stop-" + i;
      b.setAttribute("aria-pressed", String(i === selected));
      b.append(el("b", null, String(i + 1)), document.createTextNode(st.time ? st.time + " · " + st.place : st.place));
      b.addEventListener("click", () => select(i));
      box.appendChild(b);
    });
    for (let k = stages.length; k < total; k++) {
      const s = el("span", "stop secret");
      s.append(el("b", null, String(k + 1)), document.createTextNode("??? sắp mở"));
      box.appendChild(s);
    }
  }

  function renderDetail() {
    const box = $("detail");
    box.textContent = "";
    const st = stages[selected];
    if (!st) { box.appendChild(el("p", null, "Các điểm hẹn sẽ sớm xuất hiện trên bản đồ.")); return; }
    const icon = drawSprite(st.sprite, 10); icon.className = "icon";
    const body = el("div", "body");
    const top = el("div", "top");
    top.appendChild(el("span", "stg", stageLabel(selected)));
    if (st.time) top.appendChild(el("span", "time", st.time));
    body.append(top, el("h2", null, st.place));
    if (st.desc) body.appendChild(el("p", null, st.desc));
    box.append(icon, body);
  }

  function select(i) {
    selected = i;
    renderPins();
    renderStops();
    renderDetail();
  }
  drawWorld();
  renderPins();
  renderStops();
  renderDetail();

  // ---------- Slide 3 ----------
  $("endHeart").appendChild(drawSprite("heart", 12));
  $("endLine").textContent = PLAN.ending || "Hẹn gặp em nhé ♥";
  if (PLAN.notes && PLAN.notes.length) PLAN.notes.forEach((n) => $("notes").appendChild(el("li", null, n)));
  else $("notesBox").hidden = true;

  // ---------- Điều hướng slide ----------
  const slides = [$("s-intro"), $("s-map"), $("s-end")];
  let cur = 0;
  function go(n) {
    if (cur > 0 && n < 1) n = 1; // đã đồng ý thì không quay lại slide mời
    n = Math.max(0, Math.min(slides.length - 1, n));
    const dir = n >= cur ? "enter-next" : "enter-prev";
    slides.forEach((s, i) => { s.hidden = i !== n; s.classList.remove("enter-next", "enter-prev"); });
    if (n !== cur) { void slides[n].offsetWidth; slides[n].classList.add(dir); }
    cur = n;
    $("nav").hidden = n === 0;
    $("btnPrev").disabled = n <= 1;
    $("btnNext").textContent = n === slides.length - 1 ? "XEM BẢN ĐỒ ↺" : "TIẾP ▶";
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === n - 1));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  $("btnNext").addEventListener("click", () => go(cur === slides.length - 1 ? 1 : cur + 1));
  $("btnPrev").addEventListener("click", () => go(cur - 1));
  const inMap = (t) => t && t.closest && t.closest("#map");
  document.addEventListener("keydown", (e) => {
    if (cur === 0 || inMap(e.target)) return;
    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
  });
  let tx = null, ty = null;
  document.addEventListener("touchstart", (e) => {
    if (inMap(e.target)) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (cur === 0 || tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
    tx = null;
  }, { passive: true });

  // ---------- Nút KHÔNG bỏ chạy ----------
  const NO_LINES = ["Chắc chưa đó?", "Bấm nhầm rồi kìa!", "Nút này hư rồi em ơi", "Thử nút bên kia đi", "Thôi mà…"];
  let noCount = 0;
  function dodge() {
    const zone = $("noZone"), btn = $("btnNo");
    const maxX = Math.max(40, (zone.clientWidth - btn.offsetWidth) / 2 - 10);
    const x = (Math.random() * 2 - 1) * maxX, y = (Math.random() * 2 - 1) * 28;
    btn.style.transform = `translate(${x}px, ${y}px) scale(${Math.max(0.5, 1 - noCount * 0.1)})`;
    $("noMsg").textContent = NO_LINES[Math.min(noCount, NO_LINES.length - 1)];
    noCount++;
    if (noCount > NO_LINES.length) { btn.hidden = true; $("noMsg").textContent = "Nút KHÔNG đã bỏ chạy mất rồi ♥"; }
  }
  $("btnNo").addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") dodge(); });
  $("btnNo").addEventListener("click", (e) => { e.preventDefault(); dodge(); });
  $("btnYes").addEventListener("click", () => go(1));
})();
</script>
</body>
